# Rebuilds every feed and publishes them to GitHub Pages. Pages is the only
# output: nothing is committed, so branch protection never comes into play.
name: feeds

on:
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is busiest.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rssinator/**"
      - "requirements.txt"
      - ".github/workflows/feeds.yml"

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Build feeds
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          python -m rssinator.build --out site --base-url "https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
